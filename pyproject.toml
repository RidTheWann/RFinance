[build-system]
# PEP 639 SPDX license expressions and project.license-files need setuptools >= 77.
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rfinance"
version = "0.1.0"
description = "Local-first investment research and simulated portfolio management"
readme = "README.md"
requires-python = ">=3.12,<3.16"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: X11 Applications :: Qt",
  "Intended Audience :: Financial and Insurance Industry",
  "Operating System :: Microsoft :: Windows :: Windows 10",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Office/Business :: Financial :: Investment",
]
authors = [{ name = "RFinance Contributors" }]
dependencies = [
  "alembic>=1.20,<1.21",
  "pydantic>=2.14,<3",
  "PySide6>=6.8,<7",
  "SQLAlchemy>=2.1,<2.2",
]

[project.optional-dependencies]
dev = [
  "bandit>=1.8,<2",
  "hypothesis>=6.0,<7",
  "mypy>=1.18,<2",
  "pip-audit>=2.9,<3",
  "pyinstaller>=6.22,<7",
  "pytest>=8.4,<10",
  "pytest-qt>=4.5,<5",
  "ruff>=0.14,<1",
]

[project.scripts]
rfinance = "rfinance.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
qt_api = "pyside6"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TCH"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["rfinance"]
strict = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["PySide6.*", "alembic.*"]
ignore_missing_imports = true
